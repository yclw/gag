<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GAG Agent</title>
  <style>
    :root {
      --coral:#cc785c; --coral-dark:#a9583e; --ink:#141413; --body:#3d3d3a;
      --muted:#79766e; --line:#e6dfd8; --canvas:#faf9f5; --cream:#efe9de;
      --dark:#181715; --dark-2:#252320; --white:#faf9f5; --green:#5db872;
      --red:#c64545; --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
      --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    * { box-sizing:border-box }
    html,body { margin:0; min-height:100%; background:var(--canvas); color:var(--ink) }
    body { font:14px/1.55 var(--sans) }
    button,textarea { font:inherit }
    button { cursor:pointer }
    button:focus-visible,textarea:focus-visible,summary:focus-visible {
      outline:3px solid color-mix(in srgb,var(--coral) 28%,transparent); outline-offset:2px;
    }
    .topbar {
      height:68px; padding:0 clamp(18px,4vw,56px); border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; gap:24px;
    }
    .brand,.actions,.connection { display:flex; align-items:center }
    .brand { font:500 17px/1 var(--sans); letter-spacing:-.2px }
    .brand small { margin-left:5px; color:var(--muted); font:11px/1 var(--mono); letter-spacing:.08em }
    .actions { gap:8px }
    .connection { gap:8px; color:var(--muted); font-size:12px; margin-right:10px }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--muted) }
    .dot.online { background:var(--green); box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 14%,transparent) }
    .btn {
      min-height:38px; padding:0 15px; border:1px solid var(--line); border-radius:8px;
      background:transparent; color:var(--ink); font-weight:600;
    }
    .btn:hover { border-color:#cfc5ba }
    .btn.primary { border-color:var(--coral); background:var(--coral); color:white }
    .btn.primary:active { background:var(--coral-dark) }
    .btn.danger { color:var(--red) }
    .shell {
      max-width:1500px; height:calc(100dvh - 68px); margin:auto; padding:24px clamp(18px,4vw,56px) 32px;
      display:grid; grid-template-columns:minmax(0,7fr) minmax(340px,5fr); gap:24px;
    }
    .conversation { min-height:0; display:grid; grid-template-rows:auto 1fr auto }
    .section-head { padding:8px 0 18px; display:flex; justify-content:space-between; gap:20px }
    .eyebrow { color:var(--coral-dark); font:600 11px/1.3 var(--mono); letter-spacing:.12em; text-transform:uppercase }
    .run-state { align-self:end; max-width:220px; color:var(--muted); text-align:right; font-size:13px }
    .messages { min-height:0; overflow:auto; padding:2px 10px 26px 0; scroll-behavior:smooth }
    .empty { height:100%; min-height:250px; display:grid; place-content:center; text-align:center; color:var(--muted) }
    .empty strong { color:var(--ink); font:400 24px/1.2 var(--serif) }
    .message { max-width:82%; margin:0 0 22px; animation:rise .22s ease-out }
    .message.user { margin-left:auto; padding:14px 16px; border-radius:12px 12px 3px 12px; background:var(--cream) }
    .message.assistant { padding-left:19px; border-left:2px solid var(--coral) }
    .message.tool { padding:13px 15px; border:1px solid var(--line); border-radius:8px; font-family:var(--mono); font-size:12px }
    .role { margin-bottom:5px; color:var(--muted); font:600 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase }
    .message-body { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--body); font-size:15px }
    .cursor::after { content:""; display:inline-block; width:7px; height:15px; margin-left:3px;
      vertical-align:-2px; background:var(--coral); animation:blink .8s steps(1) infinite }
    .review {
      margin:0 0 18px; padding:18px; background:var(--cream); border-radius:12px;
      border-left:4px solid var(--coral);
    }
    .review h2 { margin:4px 0 10px; font:400 22px/1.2 var(--serif) }
    .review pre { margin:0 0 14px; padding:12px; overflow:auto; border-radius:7px;
      background:color-mix(in srgb,var(--canvas) 65%,transparent); font:12px/1.55 var(--mono) }
    .review-actions { display:flex; gap:8px }
    .composer { padding-top:18px; border-top:1px solid var(--line) }
    .compose-box { display:grid; grid-template-columns:1fr auto; align-items:end; gap:12px; padding:10px;
      border:1px solid var(--line); border-radius:12px; background:var(--canvas) }
    textarea { width:100%; min-height:44px; max-height:150px; resize:none; padding:10px 8px; border:0;
      outline:0!important; background:transparent; color:var(--ink); font-size:15px }
    textarea::placeholder { color:#9b978e }
    .send { height:42px; padding:0 17px; border:0; border-radius:9px; background:var(--coral); color:white;
      font-weight:600 }
    .send:disabled { cursor:not-allowed; background:var(--line); color:var(--muted) }
    .ledger {
      min-height:0; overflow:hidden; border-radius:14px; background:var(--dark); color:var(--white);
      display:grid; grid-template-rows:auto 1fr;
    }
    .ledger-head { padding:22px 22px 18px; border-bottom:1px solid #302e2a; display:flex; align-items:flex-end;
      justify-content:space-between; gap:16px }
    .ledger h2 { margin:5px 0 0; font:400 27px/1.1 var(--serif) }
    .count { color:#9d9991; font:11px/1 var(--mono) }
    .event-list { position:relative; overflow:auto; padding:22px 18px 30px 40px }
    .event { position:relative; margin:0 0 9px; border-bottom:1px solid #2e2c28; animation:rise .2s ease-out }
    .event::after { content:""; position:absolute; left:-17px; top:18px; bottom:-14px; width:1px; background:#49372f }
    .event::before { content:""; position:absolute; left:-20px; top:15px; width:7px; height:7px; border-radius:50%;
      z-index:1; background:#716c64; box-shadow:0 0 0 4px var(--dark) }
    .event.live::before { background:var(--coral) }
    .event summary { min-height:36px; padding:9px 4px; list-style:none; cursor:pointer; display:flex; gap:8px;
      align-items:center; justify-content:space-between }
    .event summary::-webkit-details-marker { display:none }
    .event-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#e9e5dd; font:12px/1.3 var(--mono) }
    .source { flex:0 0 auto; color:#817d75; font:9px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase }
    .event.live .source { color:#d89780 }
    .event pre { margin:0 0 12px; padding:10px; max-height:210px; overflow:auto; border-radius:6px;
      background:var(--dark-2); color:#bdb8af; white-space:pre-wrap; overflow-wrap:anywhere; font:11px/1.55 var(--mono) }
    .toast { position:fixed; left:50%; bottom:24px; z-index:5; transform:translate(-50%,18px); opacity:0;
      padding:11px 15px; border-radius:8px; background:var(--dark); color:var(--white); pointer-events:none;
      transition:.2s ease }
    .toast.show { transform:translate(-50%,0); opacity:1 }
    @keyframes rise { from { opacity:0; transform:translateY(5px) } }
    @keyframes blink { 50% { opacity:0 } }
    @media (max-width:850px) {
      .topbar { height:auto; min-height:68px; padding-block:12px; flex-wrap:wrap }
      .brand small,.connection span { display:none }
      .shell { height:auto; min-height:calc(100dvh - 68px); grid-template-columns:1fr; grid-template-rows:minmax(650px,1fr) 520px }
      .ledger { min-height:500px }
      .message { max-width:92% }
    }
    @media (max-width:520px) {
      .actions { width:100% }
      .actions .btn { flex:1 }
      .connection { margin-left:auto }
      .section-head { display:block }
      .run-state { margin-top:10px; text-align:left }
      .shell { padding-inline:14px; gap:16px }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      GAG ReAct Agent <small>SINGLE SESSION</small>
    </div>
    <div class="actions">
      <div class="connection"><i class="dot" id="dot"></i><span id="connection">Connecting</span></div>
      <button class="btn" id="run">Run</button>
      <button class="btn danger" id="cancel">Cancel</button>
    </div>
  </header>

  <main class="shell">
    <section class="conversation">
      <header class="section-head">
        <div class="eyebrow">Conversation</div>
        <div class="run-state" id="state">Waiting for the event stream.</div>
      </header>
      <div class="messages" id="messages">
        <div class="empty" id="empty"><div><strong>No conversation yet</strong><br>Run the graph, then send the first message.</div></div>
      </div>
      <div>
        <div id="review"></div>
        <form class="composer" id="composer">
          <div class="compose-box">
            <textarea id="message" rows="1" placeholder="Message the agent…" aria-label="Message"></textarea>
            <button class="send" id="send" disabled>Send</button>
          </div>
        </form>
      </div>
    </section>

    <aside class="ledger">
      <header class="ledger-head">
        <div><div class="eyebrow">Graph telemetry</div><h2>Event spine</h2></div>
        <span class="count" id="count">0 EVENTS</span>
      </header>
      <div class="event-list" id="events"></div>
    </aside>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const $ = id => document.getElementById(id);
    const messages = $("messages"), ledger = $("events"), review = $("review");
    let streamMessage = null, eventCount = 0, toastTimer;

    const text = content => (content || []).filter(x => x.type === "text").map(x => x.text || "").join("");
    const scroll = el => el.scrollTo({top:el.scrollHeight,behavior:"smooth"});
    const setState = value => $("state").textContent = value;
    const toast = value => {
      $("toast").textContent = value; $("toast").classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2600);
    };

    function addLedger(type, data, source = "live") {
      const row = document.createElement("details");
      row.className = `event ${source}`;
      const summary = document.createElement("summary");
      const name = document.createElement("span"), tag = document.createElement("span"), pre = document.createElement("pre");
      name.className = "event-name"; name.textContent = type;
      tag.className = "source"; tag.textContent = source;
      pre.textContent = JSON.stringify(data, null, 2);
      summary.append(name, tag); row.append(summary, pre); ledger.append(row);
      $("count").textContent = `${++eventCount} EVENT${eventCount === 1 ? "" : "S"}`;
      scroll(ledger);
    }

    function addMessage(role, body, extra = "") {
      $("empty")?.remove();
      const el = document.createElement("article");
      el.className = `message ${role}`;
      const label = document.createElement("div"), content = document.createElement("div");
      label.className = "role"; label.textContent = role === "assistant" ? "Agent" : role;
      content.className = `message-body ${extra}`; content.textContent = body;
      el.append(label, content); messages.append(el); scroll(messages);
      return el;
    }

    function showReview(data) {
      const args = typeof data.value === "string" ? data.value : JSON.stringify(data.value ?? {}, null, 2);
      review.innerHTML = "";
      const card = document.createElement("section");
      card.className = "review";
      card.innerHTML = `<div class="eyebrow">Approval required</div><h2>Allow this tool call?</h2>`;
      const pre = document.createElement("pre"); pre.textContent = args;
      const actions = document.createElement("div"); actions.className = "review-actions";
      for (const [label, approved, cls] of [["Approve",true,"primary"],["Reject",false,""]]) {
        const button = document.createElement("button");
        button.className = `btn ${cls}`; button.textContent = label;
        button.onclick = () => command("/review",{request_id:data.id,approved});
        actions.append(button);
      }
      card.append(pre, actions); review.append(card);
    }

    function processEvent(type, data, source = "live") {
      addLedger(type, data, source);
      if (type === "model.delta") {
        const chunk = text(data.chunk?.message?.content);
        if (!chunk) return;
        if (!streamMessage) streamMessage = addMessage("assistant", "", "cursor");
        streamMessage.querySelector(".message-body").textContent += chunk;
        scroll(messages);
      } else if (type === "model.message") {
        const body = text(data.content) || (data.tool_calls?.length
          ? `Calling ${data.tool_calls.map(x => x.tool_name).join(", ")}…` : "");
        if (data.role === "assistant" && streamMessage) {
          const content = streamMessage.querySelector(".message-body");
          content.textContent = body; content.classList.remove("cursor"); streamMessage = null;
        } else addMessage(data.role || "assistant", body);
      } else if (type === "interrupt.requested") {
        if (data.kind === "tool.review") {
          showReview(data); setState("Waiting for approval.");
        } else if (data.kind === "user.message") {
          review.innerHTML = ""; setState("Ready for your message.");
        }
      } else if (type === "execution.error") {
        toast(data.error || "Execution failed."); setState("Execution failed.");
      }
    }

    function reset(snapshot) {
      snapshot ||= [];
      messages.innerHTML = `<div class="empty" id="empty"><div><strong>No conversation yet</strong><br>Run the graph, then send the first message.</div></div>`;
      ledger.innerHTML = ""; review.innerHTML = ""; streamMessage = null; eventCount = 0;
      addLedger("session.snapshot",{events:snapshot.length},"history");
      snapshot.forEach(event => processEvent(event.type,event.data,"history"));
    }

    async function command(path, body) {
      try {
        const response = await fetch(path,{
          method:"POST", headers:body ? {"Content-Type":"application/json"} : {},
          body:body ? JSON.stringify(body) : undefined
        });
        if (response.status === 409) return toast("Agent is busy.");
        if (!response.ok) return toast((await response.text()).trim() || "Command failed.");
        if (path === "/chat") { $("message").value = ""; $("send").disabled = true; }
        if (path === "/review") review.innerHTML = "";
        setState(path === "/cancel" ? "Cancellation requested." : "Command accepted.");
      } catch { toast("Server is unavailable."); }
    }

    $("run").onclick = () => command("/run");
    $("cancel").onclick = () => command("/cancel");
    $("composer").onsubmit = event => {
      event.preventDefault(); const message = $("message").value.trim();
      if (message) command("/chat",{message});
    };
    $("message").oninput = event => {
      event.target.style.height = "auto";
      event.target.style.height = `${Math.min(event.target.scrollHeight,150)}px`;
      $("send").disabled = !event.target.value.trim();
    };
    $("message").onkeydown = event => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("composer").requestSubmit(); }
    };

    const source = new EventSource("/events");
    source.onopen = () => {
      $("dot").classList.add("online"); $("connection").textContent = "Live";
      setState("Following the agent.");
    };
    source.addEventListener("session.snapshot", event => reset(JSON.parse(event.data)));
    for (const type of ["model.delta","model.message","interrupt.requested","interrupt.resumed"]) {
      source.addEventListener(type,event => processEvent(type,JSON.parse(event.data)));
    }
    source.addEventListener("execution.error", event =>
      processEvent("execution.error",JSON.parse(event.data)));
    source.onerror = () => {
      $("dot").classList.remove("online"); $("connection").textContent = "Reconnecting";
      setState("Event stream disconnected.");
    };
  </script>
</body>
</html>
